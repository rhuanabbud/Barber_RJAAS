spring:
  application:
    name: barbearia-saas
  datasource:
    url: jdbc:h2:mem:barbearia;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  redis:
    host: localhost
    port: 6379
    timeout: 10000
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200

server:
  port: 8080

security:
  tenant-header: X-Tenant-Id
  auth-header: Authorization

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG

app:
  tenants:
    demo: demo
